apiVersion: v1
kind: Namespace
metadata:
  name: stellar-scanner
  labels:
    app: stellar-scanner
    component: namespace
    managed-by: stellar-scanner-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-scanner-backend
  namespace: stellar-scanner
  labels:
    app: stellar-scanner
    component: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: stellar-scanner-backend
  labels:
    app: stellar-scanner
    component: backend
rules:
- apiGroups: [""]
  resources: ["namespaces", "pods", "pods/log", "services", "configmaps", "secrets"]
  verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
- apiGroups: [""]
  resources: ["persistentvolumes", "persistentvolumeclaims"]
  verbs: ["create", "get", "list", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets", "podsecuritypolicies"]
  verbs: ["create", "get", "list", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "get", "list", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["create", "get", "list", "watch", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: stellar-scanner-backend
  labels:
    app: stellar-scanner
    component: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: stellar-scanner-backend
subjects:
- kind: ServiceAccount
  name: stellar-scanner-backend
  namespace: stellar-scanner
---
apiVersion: v1
kind: Secret
metadata:
  name: scanner-secrets
  namespace: stellar-scanner
  labels:
    app: stellar-scanner
    component: secrets
type: Opaque
data:
  # Base64 encoded values - replace with actual secrets
  encryption-key: "Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMzItY2hhcnM=" # "change-me-in-production-32-chars"
  jwt-secret: "Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=" # "change-me-in-production"
  database-url: "cG9zdGdyZXNxbDovL3VzZXI6cGFzc0BkYXRhYmFzZS9zdGVsbGFyX3NjYW5uZXI=" # "postgresql://user:pass@database/stellar_scanner"
  redis-url: "cmVkaXM6Ly9wYXNzQHJlZGlzL3N0ZWxsYXJfc2Nhbm5lcg==" # "redis://pass@redis/stellar_scanner"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: stellar-scanner-config
  namespace: stellar-scanner
  labels:
    app: stellar-scanner
    component: config
data:
  config.yaml: |
    server:
      port: 8080
    kubernetes:
      namespace: stellar-scanner
      scanner_image: "stellar-security-scanner:latest"
      log_sidecar_image: "fluent/fluent-bit:latest"
    scanner:
      default_resource_limits:
        cpu_millis: 1000
        memory_mb: 2048
        storage_mb: 1024
      default_timeout_minutes: 30
      max_concurrent_scans: 10
      cleanup_interval_minutes: 5
    auto_scaling:
      enabled: true
      scale_up_threshold: 0.8
      scale_down_threshold: 0.2
      max_scale_instances: 50
      min_scale_instances: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellar-scanner-backend
  namespace: stellar-scanner
  labels:
    app: stellar-scanner
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stellar-scanner
      component: backend
  template:
    metadata:
      labels:
        app: stellar-scanner
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: stellar-scanner-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: backend
        image: stellar-security-scanner-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: KUBERNETES_NAMESPACE
          value: "stellar-scanner"
        - name: SCANNER_IMAGE
          value: "stellar-security-scanner:latest"
        - name: LOG_SIDECAR_IMAGE
          value: "fluent/fluent-bit:latest"
        - name: DEFAULT_CPU_MILLIS
          value: "1000"
        - name: DEFAULT_MEMORY_MB
          value: "2048"
        - name: DEFAULT_STORAGE_MB
          value: "1024"
        - name: DEFAULT_TIMEOUT_MINUTES
          value: "30"
        - name: MAX_CONCURRENT_SCANS
          value: "10"
        - name: CLEANUP_INTERVAL_MINUTES
          value: "5"
        - name: AUTO_SCALE_ENABLED
          value: "true"
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: scanner-secrets
              key: encryption-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: scanner-secrets
              key: jwt-secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: scanner-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: scanner-secrets
              key: redis-url
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/stellar-scanner
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: stellar-scanner-config
      - name: tmp
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "stellar.scanner/dedicated"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: stellar-scanner-backend
  namespace: stellar-scanner
  labels:
    app: stellar-scanner
    component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: stellar-scanner
    component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stellar-scanner-backend
  namespace: stellar-scanner
  labels:
    app: stellar-scanner
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stellar-scanner-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stellar-scanner-backend
  namespace: stellar-scanner
  labels:
    app: stellar-scanner
    component: backend
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.stellar-scanner.io
    secretName: stellar-scanner-backend-tls
  rules:
  - host: api.stellar-scanner.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stellar-scanner-backend
            port:
              number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: stellar-scanner-backend
  namespace: stellar-scanner
  labels:
    app: stellar-scanner
    component: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: stellar-scanner
      component: backend
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: encrypted-ssd
  labels:
    app: stellar-scanner
    component: storage
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
  fsType: ext4
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
