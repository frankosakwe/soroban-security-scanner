[package]
name = "stellar-security-scanner-backend"
version = "0.1.0"
edition = "2021"
authors = ["Security Scanner Team"]
description = "Kubernetes-based backend service for Stellar Security Scanner"
license = "MIT"
keywords = ["stellar", "soroban", "security", "kubernetes", "scanner"]

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.4", features = ["util", "timeout", "load-shed"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
hyper = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Kubernetes client
kube = { version = "0.88", features = ["runtime", "client", "ws"] }
k8s-openapi = { version = "0.21", features = ["v1_28"] }

# Database and caching
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
redis = { version = "0.24", features = ["tokio-comp"] }

# Authentication and security
jsonwebtoken = "9.2"
bcrypt = "0.15"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Configuration and logging
clap = { version = "4.0", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"

# Time and chrono
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Metrics and monitoring
prometheus = "0.13"
metrics = "0.22"
metrics-exporter-prometheus = "0.13"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Configuration
config = "0.14"

# Error handling
eyre = "0.6"

[dev-dependencies]
tempfile = "3.0"
pretty_assertions = "1.0"
mockall = "0.12"
